syntax = "proto3";

package ntx.v1;

option go_package = "github.com/voidarchive/ntx/gen/go/ntx/v1;ntxv1";

// PortfolioService is the owner's personal layer (GLOSSARY: Holding). Every
// method requires the owner token in the "Ntx-Owner-Token" header (ADR 0006);
// without it the call fails with Unauthenticated and no detail.
service PortfolioService {
  rpc GetPortfolio(GetPortfolioRequest) returns (GetPortfolioResponse);
  rpc UpsertHolding(UpsertHoldingRequest) returns (UpsertHoldingResponse);
  rpc DeleteHolding(DeleteHoldingRequest) returns (DeleteHoldingResponse);
  rpc AddTransaction(AddTransactionRequest) returns (AddTransactionResponse);
  rpc AddNote(AddNoteRequest) returns (AddNoteResponse);
  rpc UpsertGate(UpsertGateRequest) returns (UpsertGateResponse);
  rpc DeleteGate(DeleteGateRequest) returns (DeleteGateResponse);
  rpc UpdateRules(UpdateRulesRequest) returns (UpdateRulesResponse);
  // GetHoldingStory is the "Your thesis" section of a held company's page.
  rpc GetHoldingStory(GetHoldingStoryRequest) returns (GetHoldingStoryResponse);
}

enum GateKind {
  GATE_KIND_UNSPECIFIED = 0;
  GATE_KIND_METRIC = 1;
  GATE_KIND_EVENT = 2;
}

// The prior directions are ratchets: the threshold is the previous period's own figure.
enum GateDirection {
  GATE_DIRECTION_UNSPECIFIED = 0;
  GATE_DIRECTION_ABOVE = 1;
  GATE_DIRECTION_BELOW = 2;
  GATE_DIRECTION_NOT_BELOW_PRIOR = 3;
  GATE_DIRECTION_NOT_ABOVE_PRIOR = 4;
}

// Gate is one of the owner's written break conditions with its verdict
// (GLOSSARY: Gate; Triggered / Holds / Needs data). Every verdict names the
// period it was evaluated against (ADR 0002).
message Gate {
  int64 id = 1;
  string symbol = 2;
  GateKind kind = 3;
  // Metric gates: one of eps, pe, cash_dividend_percent, bonus_percent, book_value, roe,
  // promoter_percent, weight_percent, drawdown_percent, npl_percent, car_percent,
  // loan_growth_percent, distributable_profit.
  string metric = 4;
  GateDirection direction = 5;
  double threshold = 6;
  int32 periods = 7;
  // Event gates: the condition in the owner's words and the day it was last ticked.
  string text = 8;
  string checked_on = 9;
  // Computed: "triggered", "holds" or "needs data"; empty for an event gate.
  string verdict = 10;
  // The gate in words, "NPL above 5% for 1 quarter"; the lede and the table share it.
  string label = 11;
  optional double value = 12;
  // For a prior direction, the previous period's figure the value was held against.
  optional double prior = 13;
  string period = 14;
  string source = 15;
  // How value and prior print: "%", "x" or "Rs".
  string unit = 16;
}

// Cap is one portfolio rule's verdict: "holds", "watch" or "triggered", with the figures.
message Cap {
  string rule = 1;
  string verdict = 2;
  string detail = 3;
}

message Rules {
  double soft_cap_percent = 1;
  double hard_cap_percent = 2;
  double sector_cap_percent = 3;
  int32 max_positions = 4;
  double min_entry_rs = 5;
  bool one_hydro_per_basin = 6;
  string candidate_min_rating = 7;
  bool candidate_dividend_record = 8;
  double monthly_budget_rs = 9;
  double multiplier_below_median = 10;
  double multiplier_bottom_quarter = 11;
}

enum HoldingStatus {
  HOLDING_STATUS_UNSPECIFIED = 0;
  HOLDING_STATUS_BUILD = 1;
  HOLDING_STATUS_HOLD = 2;
  HOLDING_STATUS_FROZEN = 3;
}

enum TransactionKind {
  TRANSACTION_KIND_UNSPECIFIED = 0;
  TRANSACTION_KIND_BUY = 1;
  TRANSACTION_KIND_SELL = 2;
  TRANSACTION_KIND_BONUS = 3;
  TRANSACTION_KIND_RIGHTS = 4;
  TRANSACTION_KIND_IPO = 5;
}

message Transaction {
  int64 id = 1;
  string day = 2;
  TransactionKind kind = 3;
  int64 quantity = 4;
  // Per share as TMS shows it, fees included; NAV for a fund unit.
  double price = 5;
}

message Note {
  int64 id = 1;
  string day = 2;
  string text = 3;
}

message Holding {
  string symbol = 1;
  string name = 2;
  string sector = 3;
  HoldingStatus status = 4;
  int64 target_shares = 5;
  double allocation_percent = 6;
  double carry_rs = 7;
  bool drawdown_gate = 8;
  string thesis = 9;
  string frozen_reason = 10;
  string review_date = 11;
  // Derived from transactions: quantity and weighted average cost.
  int64 quantity = 12;
  double wac = 13;
  // Latest close, or the NAV the caller supplied for a fund; unset when neither exists.
  optional double close = 14;
  double value = 15;
  double weight_percent = 16;
  // A holding with no company row is a mutual fund: in the weight denominator, not a position.
  bool is_fund = 17;
  repeated Transaction transactions = 18;
  repeated Note notes = 19;
  // Business date of the close; empty for a fund, whose NAV date the caller knows.
  string close_day = 20;
  repeated Gate gates = 21;
  // The holding against the soft and hard caps: "holds", "watch", "triggered"; empty without shares.
  string cap_verdict = 22;
}

message GetPortfolioRequest {
  // NAV per unit by fund symbol, from the web's nav.json snapshot.
  map<string, double> fund_navs = 1;
}

message GetPortfolioResponse {
  repeated Holding holdings = 1;
  double total_value = 2;
  // Holdings with shares and a company row; funds and watched companies are not positions.
  int32 positions = 3;
  int32 funds = 4;
  // The page's opening sentence, computed here (ADR 0001).
  string opening = 5;
  // Sector cap, position count and one hydro per basin.
  repeated Cap caps = 6;
  Rules rules = 7;
}

message UpsertHoldingRequest {
  string symbol = 1;
  HoldingStatus status = 2;
  int64 target_shares = 3;
  double allocation_percent = 4;
  double carry_rs = 5;
  bool drawdown_gate = 6;
  string thesis = 7;
  string frozen_reason = 8;
  string review_date = 9;
}

message UpsertHoldingResponse { Holding holding = 1; }

message DeleteHoldingRequest { string symbol = 1; }

message DeleteHoldingResponse {}

message AddTransactionRequest {
  string symbol = 1;
  string day = 2;
  TransactionKind kind = 3;
  int64 quantity = 4;
  double price = 5;
}

message AddTransactionResponse { Transaction transaction = 1; }

message AddNoteRequest {
  string symbol = 1;
  string day = 2;
  string text = 3;
}

message AddNoteResponse { Note note = 1; }

message UpsertGateRequest {
  // Zero inserts; an existing id updates.
  int64 id = 1;
  string symbol = 2;
  GateKind kind = 3;
  string metric = 4;
  GateDirection direction = 5;
  double threshold = 6;
  int32 periods = 7;
  string text = 8;
  string checked_on = 9;
}

message UpsertGateResponse { Gate gate = 1; }

message DeleteGateRequest { int64 id = 1; }

message DeleteGateResponse {}

message UpdateRulesRequest { Rules rules = 1; }

message UpdateRulesResponse { Rules rules = 1; }

message GetHoldingStoryRequest {
  string symbol = 1;
  map<string, double> fund_navs = 2;
}

message GetHoldingStoryResponse {
  Holding holding = 1;
  // A bonus the exchange has published that no bonus transaction credits yet; empty otherwise.
  string bonus_hint = 2;
}
