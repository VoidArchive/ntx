syntax = "proto3";

package ntx.v1;

option go_package = "github.com/voidarchive/ntx/gen/go/ntx/v1;ntxv1";

// StoryService returns what a company's filings say, computed in the API (ADR 0001).
service StoryService {
  rpc GetCompanyStory(GetCompanyStoryRequest) returns (GetCompanyStoryResponse);
}

message GetCompanyStoryRequest {
  string symbol = 1;
  // Matched by the web from its fund NAV file; the engine does not read files.
  FundHoldings funds = 10;
}

// Open-ended mutual funds holding this company, as the web matched them.
message FundHoldings {
  int32 count = 1;
  double total_value = 2; // Rs
  string largest_name = 3;
  double largest_value = 4; // Rs
  string as_of = 5; // NAV report month, e.g. "2083 Ashwin"
}

message GetCompanyStoryResponse {
  repeated Claim claims = 1;
  repeated Strip strips = 2;
  // Period of the newest filing, e.g. "Q1 2083/84"; empty when there is none.
  string last_filing = 3;
  Quote quote = 4;
  // Quarters with a quarter-only profit, oldest first.
  repeated Quarter quarters = 20;
  // Result publication and notice dates for the price chart, oldest first.
  repeated EventMark events = 21;
  // Set for hydro companies only.
  HydroEps hydro_eps = 22;
  // Newest first; one row per fiscal year with a full-year filing or a notice.
  repeated FiscalYear fiscal_years = 10;
  repeated Growth growth = 11;
  // Oldest first.
  repeated OwnershipObservation ownership = 12;
  // The eight published rules, in a fixed order (GLOSSARY: Check).
  repeated Check checks = 30;
  // One letter summarising the checks (GLOSSARY: Rating); unset when fewer than four evaluate.
  Rating rating = 31;
  // Same-sector companies from their latest quarterly row and close, by PE; no PE sorts last.
  repeated Peer peers = 40;
  // Data footer.
  string synced_at = 41;   // when NTX stored the newest price row, UTC, "2026-11-04 09:28"
  string filed_at = 42;    // newest filing's published date, else the day NTX first stored it
  bool filed_at_seen = 43; // filed_at is NTX's first-seen day, not the exchange's
}

message Peer {
  string symbol = 1;
  string name = 2;
  optional double pe = 3; // unset when EPS is not positive
  optional double pb = 4; // unset without book value
}

// A to D from the share of Holds among the checks that could be evaluated; not a recommendation.
message Rating {
  string letter = 1; // "A".."D"
  int32 holds = 2;
  int32 evaluated = 3; // checks whose verdict is not "needs more history"
}

// One published rule and its verdict; a verdict is not a recommendation.
message Check {
  string name = 1;
  string rule = 2;    // the sentence, threshold included
  string verdict = 3; // holds | watch | needs more history
}

// One fiscal year's results and payout (GLOSSARY: Payout, Bonus-adjusted return).
message FiscalYear {
  string year = 1; // "2082/83"
  optional double eps = 2;
  optional double profit = 3; // Rs
  optional double book_value = 4;
  optional double shares_outstanding = 5;
  optional double bonus = 6;  // % of par
  optional double cash = 7;   // % of par
  optional double rights = 8; // % of par; shown, excluded from the return
  string payout = 9;          // paid | none | not recorded
  optional double return = 10; // bonus-adjusted, %; rights excluded
  string source = 11;         // notice URL, empty when not recorded
}

// Compounded annual growth, in %, over 1, 3 and 5 fiscal years; unset when a year is missing.
message Growth {
  string metric = 1; // profit | eps | book_value | price
  optional double one = 2;
  optional double three = 3;
  optional double five = 4;
}

message OwnershipObservation {
  string as_of = 1;
  optional double promoter = 2; // %
  optional double public = 3;   // %
}

// One sentence computed from a company's rows (GLOSSARY: Claim).
message Claim {
  string kind = 1; // earnings | valuation | record
  string text = 2;
  double value = 3;
  string unit = 4;   // "Rs", "%", "x", ""
  string period = 5; // "Q1 2083/84" or "FY 2082/83"
  string source = 6; // filing URL, empty when not recorded
  string anchor = 7; // id of the evidence section the sentence links to
}

// Where one ratio sits on the sector's distribution and on its own range (GLOSSARY: Strip).
message Strip {
  string ratio = 1; // pe | pb | eps | yield
  optional double value = 2;
  Range sector = 3; // unset when the sector has no values
  Range own = 4;    // unset when the company has no history
}

message Range {
  double low = 1;
  double median = 2;
  double high = 3;
  int32 count = 4;
}

// The latest close and its change on the previous trading day.
message Quote {
  double close = 1;
  optional double change = 2;
  optional double change_percent = 3;
  string business_date = 4;    // "2026-11-03"
  string business_date_bs = 5; // "Kartik 17, 2083"
}

// One quarter's own result; stored profit is year-to-date, this is the difference.
message Quarter {
  string period = 1;      // "Q1 2083/84"
  string fiscal_year = 2; // "2083/84"
  double profit = 3;      // quarter-only, Rs
  optional double eps = 4;            // quarter-only; unset without paid-up capital
  optional double annualized_eps = 5; // as filed
  string label = 6;        // "Best Q1 in five years", "3rd rise in a row", or ""
  string published_at = 7; // empty when not recorded
  string source_url = 8;   // empty when not recorded
  bool is_monsoon = 9;     // hydro Q1: annualized EPS overstates the year
}

// A dated result or notice on the price chart's time axis.
message EventMark {
  string date = 1;  // "2026-02-10"
  string kind = 2;  // result | notice
  string label = 3; // "Q2", "FY", "10% cash, 5% bonus"
}

// A hydro company's latest EPS for the quarter, annualized, and for the last full year.
message HydroEps {
  double quarter = 1;
  double annualized = 2;
  double full_year = 3;
  string full_year_period = 4; // "FY 2081/82"
}
