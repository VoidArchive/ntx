syntax = "proto3";

package ntx.v1;

import "ntx/v1/common.proto";

option go_package = "github.com/voidarchive/ntx/gen/go/ntx/v1;ntxv1";

service CompanyService {
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
  rpc GetFundamentals(GetFundamentalsRequest) returns (GetFundamentalsResponse);
  rpc GetSectorStats(GetSectorStatsRequest) returns (GetSectorStatsResponse);
  rpc GetOwnership(GetOwnershipRequest) returns (GetOwnershipResponse);
  rpc GetCorporateActions(GetCorporateActionsRequest)
      returns (GetCorporateActionsResponse);
  // Every listed company with its latest close, ratios and stored rating, for the screener.
  rpc ListScreener(ListScreenerRequest) returns (ListScreenerResponse);
}

message ListScreenerRequest {}

message ListScreenerResponse { repeated ScreenerRow rows = 1; }

// Ratios come from the latest quarterly row at the latest close, as the strips do.
message ScreenerRow {
  string symbol = 1;
  string name = 2;
  Sector sector = 3;
  optional double close = 4;
  optional double pe = 5;         // unset when EPS is not positive
  optional double pb = 6;         // unset without book value
  optional double eps = 7;        // annualized, as filed
  optional double yield = 8;      // %, cash dividend over close; unset without a notice
  optional double market_cap = 9; // Rs, close times listed shares
  optional double turnover = 10;  // Rs, latest session
  string rating = 11;             // "A".."D", "" when unrated or not yet computed
  string period = 12;             // the filing the ratios come from, "Q1 2083/84"; "" without one
  string close_date = 13;         // business date of the close, "2026-11-03"; "" without one
  optional double change_percent = 14; // %, on the previous close; unset without one
}

message ListCompaniesRequest {
  optional Sector sector = 1;
  optional string query = 2;
  optional int32 limit = 3;
  optional int32 offset = 4;
}

message ListCompaniesResponse { repeated Company companies = 1; }

message GetCompanyRequest { string symbol = 1; }

message GetCompanyResponse { Company company = 1; }

message GetFundamentalsRequest { string symbol = 1; }

message GetFundamentalsResponse {
  Fundamental latest = 1;
  repeated Fundamental history = 2;
}

message GetSectorStatsRequest { Sector sector = 1; }

message GetSectorStatsResponse { SectorStats stats = 1; }

message SectorStats {
  Sector sector = 1;
  int32 company_count = 2;
  optional double avg_eps = 3;
  optional double avg_pe_ratio = 4;
  optional double avg_book_value = 5;
  optional double avg_profit_growth = 6; // YoY average
}

message GetOwnershipRequest { string symbol = 1; }

message GetOwnershipResponse { Ownership ownership = 1; }

message GetCorporateActionsRequest { string symbol = 1; }

message GetCorporateActionsResponse { repeated CorporateAction actions = 1; }
